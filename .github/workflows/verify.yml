# Build 01 verification pipeline (development tooling only).
# Runs the quality gates from BUILD_01.md on every push and pull request:
# typecheck, lint, tests and production build. Also commits the dependency
# lockfile. GitHub/source control is outside Elvie's production trust
# boundary (ARCHITECTURE.md).
name: verify

on:
  push:
    branches: [build-01-application-foundation]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        id: typecheck
        run: npm run typecheck
        continue-on-error: true
      - name: Lint
        id: lint
        run: npm run lint
        continue-on-error: true
      - name: Tests
        id: tests
        run: npm run test
        continue-on-error: true
      - name: Production build
        id: build
        run: npm run build
        continue-on-error: true
      - name: Report outcomes
        if: always()
        run: |
          echo "typecheck: ${{ steps.typecheck.outcome }}"
          echo "lint: ${{ steps.lint.outcome }}"
          echo "tests: ${{ steps.tests.outcome }}"
          echo "build: ${{ steps.build.outcome }}"
      - name: Fail if any check failed
        if: always()
        run: |
          if [ "${{ steps.typecheck.outcome }}" != "success" ]              || [ "${{ steps.lint.outcome }}" != "success" ]              || [ "${{ steps.tests.outcome }}" != "success" ]              || [ "${{ steps.build.outcome }}" != "success" ]; then
            exit 1
          fi

  lockfile:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/build-01-application-foundation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile
        run: npm install --package-lock-only
      - name: Commit lockfile if changed
        run: |
          git config user.name "elvie-ci"
          git config user.email "elvie-ci@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile unchanged."
          else
            git commit -m "chore: update dependency lockfile [skip ci]"
            git push
          fi
